services:
  legalone-sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: legalone-sync:latest
    container_name: legalone-sync
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/historico_processos.db
      - STORAGE_DIR=/app/storage
      - TEMP_DIR=/app/temp
    volumes:
      # SQLite database volume configurable via DB_VOLUME_PATH (default: ./data)
      - ${DB_VOLUME_PATH:-./data}:/app/data
      # Local backup storage volume configurable via STORAGE_VOLUME_PATH (default: ./storage)
      - ${STORAGE_VOLUME_PATH:-./storage}:/app/storage
      # Temporary scratch folder for LibreOffice conversion
      - ./temp:/app/temp
    restart: "no"
