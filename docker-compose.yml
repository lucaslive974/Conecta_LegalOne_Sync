version: '3.8'

services:
  legalone-sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: legalone-sync:latest
    container_name: legalone-sync
    env_file:
      - .env
    volumes:
      # Volume do banco SQLite configurável via DB_VOLUME_PATH (padrão: ./data)
      - ${DB_VOLUME_PATH:-./data}:/app/data
      # Volume da cópia local dos arquivos DOCX e PDF configurável via STORAGE_VOLUME_PATH (padrão: ./storage)
      - ${STORAGE_VOLUME_PATH:-./storage}:/app/storage
      # Diretório temporário para renderização do LibreOffice
      - ./temp:/app/temp
    restart: "no"
